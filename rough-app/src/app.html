<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		
		<!-- Optimize resource loading -->
		<link rel="dns-prefetch" href="//fonts.googleapis.com" />
		<link rel="dns-prefetch" href="//fonts.gstatic.com" />
		
		<!-- Favicon with emoji for quick loading -->
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
		
		<!-- Performance optimizations -->
		<meta name="theme-color" content="#667eea" />
		<meta name="color-scheme" content="light dark" />
		
		<!-- Preload critical resources -->
		<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2" />
		
		<!-- SEO and social media -->
		<meta name="description" content="TaskFlow - A beautiful, Notion-like task management application. Organize your tasks with style." />
		<meta name="keywords" content="todo, task management, productivity, notion, organize" />
		<meta name="author" content="TaskFlow" />
		
		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="TaskFlow - Beautiful Task Management" />
		<meta property="og:description" content="Organize your tasks with a beautiful, Notion-like interface" />
		<meta property="og:image" content="/og-image.png" />
		
		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="TaskFlow - Beautiful Task Management" />
		<meta name="twitter:description" content="Organize your tasks with a beautiful, Notion-like interface" />
		
		<!-- Critical CSS for above-the-fold content -->
		<style>
			/* Critical CSS for immediate rendering */
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
				line-height: 1.6;
				margin: 0;
				padding: 0;
				background: #f8fafc;
				color: #2d3748;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}
			
			/* Prevent flash of unstyled content */
			.loading-fallback {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				display: flex;
				align-items: center;
				justify-content: center;
				color: white;
				font-size: 1.2rem;
				font-weight: 500;
				z-index: 9999;
			}
			
			.loading-fallback::after {
				content: '📝';
				font-size: 3rem;
				margin-bottom: 1rem;
				display: block;
			}
		</style>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Fallback loading screen for immediate display -->
		<div class="loading-fallback">
			<div>
				<div style="font-size: 3rem; margin-bottom: 1rem;">📝</div>
				Loading TaskFlow...
			</div>
		</div>
		
		<div style="display: contents">%sveltekit.body%</div>
		
		<!-- Remove loading fallback after app loads -->
		<script>
			window.addEventListener('load', function() {
				const fallback = document.querySelector('.loading-fallback');
				if (fallback) {
					fallback.style.opacity = '0';
					fallback.style.transition = 'opacity 0.3s ease';
					setTimeout(() => fallback.remove(), 300);
				}
			});
			
			// Handle offline state
			window.addEventListener('online', () => {
				document.body.classList.remove('offline');
			});
			
			window.addEventListener('offline', () => {
				document.body.classList.add('offline');
			});
			
			// Performance monitoring
			if ('PerformanceObserver' in window) {
				// Monitor Largest Contentful Paint
				const lcpObserver = new PerformanceObserver((entryList) => {
					const entries = entryList.getEntries();
					const lastEntry = entries[entries.length - 1];
					console.log('LCP:', lastEntry.startTime);
				});
				lcpObserver.observe({ entryTypes: ['largest-contentful-paint'] });
				
				// Monitor First Input Delay
				const fidObserver = new PerformanceObserver((entryList) => {
					const entries = entryList.getEntries();
					entries.forEach((entry) => {
						console.log('FID:', entry.processingStart - entry.startTime);
					});
				});
				fidObserver.observe({ entryTypes: ['first-input'] });
			}
		</script>
	</body>
</html>
